# EECE 568 study configuration. Paths are absolute or relative to the repo root.
# Values here are read by hcmv.config.load_config(); CLI overrides use dotted keys.

paths:
  repo_root: /scratch/st-zlaksman-1/pmoheban/SORAT
  output_root: results_hcm_vendor
  mms2_info_csv: "/scratch/st-zlaksman-1/pmoheban/M&Ms_2/MnM2/dataset_information.csv"
  mms2_sa_root: "/scratch/st-zlaksman-1/pmoheban/M&Ms_2/MnM2/SA"
  mms2_samplesheet: data/mms2_sa_samplesheet_full.csv
  acdc_testing_root: /scratch/st-zlaksman-1/pmoheban/ACDC/database/testing
  acdc_samplesheet: data/acdc_testing_samplesheet.csv
  sorat_results:
    mms2: results/MMS_2
    acdc: results/ACDC

segmentation_model_tag: nnformer__fold0

cohort:
  diseases: [NOR, HCM]
  positive_class: HCM
  vendor_map:
    SIEMENS: Siemens
    "Philips Medical Systems": Philips
    "GE MEDICAL SYSTEMS": GE
  train_vendors: [Siemens, Philips]
  expected_counts:            # asserted when the cohort table is built
    mms2:
      Siemens: {HCM: 30, NOR: 22}
      Philips: {HCM: 27, NOR: 35}
      GE: {HCM: 3, NOR: 18}
    acdc:
      Siemens: {HCM: 10, NOR: 10}

feature_configs:              # keys mirror params.feature_extraction.radiomics
  raw: {}                     # PyRadiomics defaults, as in the original SORAT runs
  norm:                       # primary: harmonized for cross-scanner comparison
    normalize: true
    normalize_scale: 100
    bin_count: 32
    resample_spacing: "1.25,1.25,0"
    force2d: true
    force2d_dimension: 0

seed: 20261001
cv:
  outer_splits: 5
  outer_repeats: 5
  inner_splits: 5
bootstrap_resamples: 2000
permutations: 1000

# Model zoo. Grids are searched by GridSearchCV inside each outer training fold
# (inner CV scoring: roc_auc). All models are class-balanced. `null` means None.
inner_scoring: roc_auc
models:
  lr_en:        # C = logspace(-3, 2, 8)
    C: [0.001, 0.005179, 0.026827, 0.138950, 0.719686, 3.727594, 19.306977, 100.0]
    l1_ratio: [0.1, 0.5, 0.9]
  svm:          # RBF; gamma = 1 / sigma^2 in the proposal's notation
    C: [0.1, 1.0, 10.0, 100.0]
    gamma: [scale, 0.0001, 0.001, 0.01, 0.1]   # 1e-4 added after the E1 grid edge check (2026-10-03)
  rf:
    max_depth: [null, 3, 5]
    max_features: [sqrt, 0.3]
    min_samples_leaf: [1, 3, 5]
  xgb:
    n_estimators: [100, 300]
    learning_rate: [0.03, 0.1]
    max_depth: [2, 3]
    min_child_weight: [1, 3]
  mlp:          # 2 hidden layers (ReLU + dropout), Adam, early stopping on a 20% inner split
    hidden: [[32, 16], [64, 32]]
    dropout: [0.2, 0.5]
    weight_decay: [0.0001, 0.001, 0.01]
  tabpfn: {}    # TabPFN v2 (pre-trained transformer, tabpfn 2.0.9): used as is, nothing tuned

# Experiment runner. Results go to <output_root>/runs/<experiment>/<unit>/<family_set>/<model>/<feature_config>/.
experiments:
  runs_dir: runs               # result store under output_root; smoke runs add a -smoke suffix
  feature_config: norm
  source: null                # feature source; null = segmentation_model_tag (use `gt` for S1)
  family_sets: [all, all-no-wt]
  transfer_seeds: 5           # seeds averaged for stochastic models (rf, xgb, mlp) in transfers
  model_params: {}            # fixed estimator params per model, e.g. {mlp: {max_epochs: 500}}
  E1:
    kind: nested_cv
    cohorts:
      pooled: {role: train_pool}
      siemens: {role: train_pool, vendor: Siemens}
      philips: {role: train_pool, vendor: Philips}
  E2:
    kind: transfer
    directions:
      siemens_to_philips:
        train: {role: train_pool, vendor: Siemens}
        test: {role: train_pool, vendor: Philips}
      philips_to_siemens:
        train: {role: train_pool, vendor: Philips}
        test: {role: train_pool, vendor: Siemens}
  E5:                         # external test: all M&Ms-2 NOR/HCM (incl. GE) -> ACDC NOR/HCM
    kind: transfer
    datasets: [mms2, acdc]
    directions:
      mms2_to_acdc:
        train: {dataset: mms2}
        test: {dataset: acdc}
  GE:                         # GE specificity check: Siemens + Philips pool -> GE subjects
    kind: transfer
    directions:
      pool_to_ge:
        train: {role: train_pool}
        test: {role: ge_check}

# `--smoke`: tiny CV, 2-point grids, few resamples; written to runs-smoke/ instead of runs/.
smoke:
  cv: {outer_splits: 2, outer_repeats: 1, inner_splits: 2}
  bootstrap_resamples: 100
  transfer_seeds: 2
  model_params:
    rf: {n_estimators: 50}
    mlp: {max_epochs: 100, patience: 10}

# E3: vendor probe on normal (NOR) subjects only, with a label-permutation test.
e3:
  disease: NOR
  targets:
    three_vendor: [Siemens, Philips, GE]     # primary: chance = 1/3
    siemens_vs_philips: [Siemens, Philips]   # secondary: the two training vendors
  probes:                                    # name: [feature config, family set]
    clinical: [norm, clinical]
    shape: [norm, shape]
    texture_norm: [norm, texture]
    texture_raw: [raw, texture]
    all: [norm, all]
  classifiers: [logreg, rf]                  # primary: multinomial L2 LR with C tuned inside; secondary: fixed RF
  logreg_C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  rf: {n_estimators: 500, max_features: sqrt, min_samples_leaf: 1}
  outer_splits: 5
  outer_repeats: 5        # for the point estimate and bootstrap CI
  inner_splits: 5
  # The permutation null reruns the first outer repeat's splits with shuffled vendor labels,
  # and the observed statistic for the p-value is that same repeat's balanced accuracy.
